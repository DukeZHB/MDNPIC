# MDNPIC configuration for the MHIST dataset (HP vs. SSA, 2 classes)
data:
    dataset: MHIST
    traindata: ./data/MHIST
    testdata: ./data/MHIST
    num_classes: 2
    num_channels: 3
    num_workers: 4
    label_min_max: [0.001, 0.999]

model:
    arch: resnet18
    feature_dim: 128
    hidden_dim: 128
    data_dim: 224
    var_type: fixedsmall
    ema: true
    ema_rate: 0.999
    cat_y_pred: true

diffusion:
    timesteps: 1000
    test_timesteps: 50
    beta_schedule: linear
    beta_start: 0.0001
    beta_end: 0.02
    noise_prior: false
    include_guidance: true
    apply_aux_cls: true
    num_sample: 1
    # Cross-Modal Semantic Alignment Regularization (CMASR)
    cmasr:
        tau: 0.2
        lambda_global: 0.5
        lambda_local: 0.5
        lambda_texture: 0.5
    # Multi-Granularity Conditional Guidance (MGCG) pre-training
    aux_cls:
        pre_train: true
        n_pretrain_epochs: 30
        logging_interval: 5
        joint_train: false

optim:
    optimizer: Adam
    lr: 0.0002
    beta1: 0.9
    amsgrad: false
    eps: 0.00000001
    weight_decay: 0.0001
    grad_clip: 1.0
    lr_schedule: false
    min_lr: 0.000002

aux_optim:
    optimizer: Adam
    lr: 0.0002
    beta1: 0.9
    amsgrad: false
    eps: 0.00000001
    weight_decay: 0.0001
    grad_clip: 1.0

training:
    batch_size: 64
    n_epochs: 150
    logging_freq: 100
    snapshot_freq: 1000
    validation_freq: 5
    lambda_ce: 0.01
    image_folder: images
    lr_schedule: false
    warmup_epochs: 5

testing:
    batch_size: 128
    image_folder: images
    ckpt_id: null
